<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Password Recovery — ALMATRACE" />
  <title>Reset Password — ALMATRACE</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="site-header" role="banner">
    <div class="container">
      <div class="site-header__brand">
        <a href="/" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: var(--space-2);">
          <span class="site-header__logo" aria-hidden="true">◈</span>
          <span class="site-header__name">ALMATRACE</span>
        </a>
      </div>
      <nav class="site-header__nav"><a href="/login.html" class="btn btn--outline">Sign In</a></nav>
    </div>
  </header>

  <main id="main-content" class="container" style="max-width: 32rem; padding-block: var(--space-12);">
    <div class="feature-card" style="padding: var(--space-8);">
      <h1 style="font-size: var(--text-2xl); font-weight: 800; margin-bottom: var(--space-2);">Reset Password</h1>
      <p style="color: var(--color-text-muted); font-size: var(--text-sm); margin-bottom: var(--space-6);">
        Enter your institutional email address and we will send you instructions to reset your password.
      </p>

      <div id="status-box" class="notice-card" style="display: none; margin-bottom: var(--space-6); padding: var(--space-4);" role="status">
        <p id="status-message" style="font-size: var(--text-sm);"></p>
      </div>

      <form id="forgot-form" novalidate>
        <div style="margin-bottom: var(--space-6);">
          <label for="email" style="display: block; font-weight: 600; font-size: var(--text-sm); margin-bottom: var(--space-1);">
            Institutional Email Address
          </label>
          <input
            type="email"
            id="email"
            required
            placeholder="e.g. rollnumber@psgtech.ac.in"
            style="width: 100%; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius); font-size: var(--text-base);"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn--primary" style="width: 100%; padding-block: var(--space-3);">
          Send Reset Instructions
        </button>
      </form>

      <div style="margin-top: var(--space-6); text-align: center; font-size: var(--text-sm);">
        <a href="/login.html">Return to Sign In</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container"><p>ALMATRACE — Department of MCA, PSG College of Technology.</p></div>
  </footer>

  <script type="module">
    import { ApiClient } from '/js/services/api.js';

    const api = new ApiClient('/api/v1');
    const form = document.getElementById('forgot-form');
    const statusBox = document.getElementById('status-box');
    const statusMessage = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const res = await api.post('/auth/password/forgot', { email });
        form.style.display = 'none';
        statusBox.style.display = 'block';
        statusBox.style.background = '#f0fdf4';
        statusBox.style.borderColor = 'var(--color-success)';
        statusMessage.textContent = res.message;
      } catch (err) {
        statusBox.style.display = 'block';
        statusBox.style.background = '#fef2f2';
        statusBox.style.borderColor = 'var(--color-error)';
        statusMessage.textContent = err.message || 'An error occurred. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Instructions';
      }
    });
  </script>
</body>
</html>
