<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Manage ALMATRACE mentorship requests and active connections." />
  <title>Requests & Meetings — ALMATRACE</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container">
      <div class="site-header__brand">
        <a href="/dashboard.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: var(--space-2);">
          <span class="site-header__logo" aria-hidden="true">◈</span>
          <span class="site-header__name">ALMATRACE</span>
        </a>
      </div>
      <nav class="site-header__nav" aria-label="Main navigation" style="display: flex; gap: var(--space-3); align-items: center;">
        <a href="/dashboard.html" style="color: var(--color-text-on-primary); text-decoration: none;">Dashboard</a>
        <a href="/lineage.html" style="color: var(--color-text-on-primary); text-decoration: none;">Lineage</a>
        <a href="/mentors.html" style="color: var(--color-text-on-primary); text-decoration: none;">Find Mentors</a>
        <a href="/requests.html" style="color: var(--color-brand-accent); font-weight: 700; text-decoration: none;">Requests</a>
        <button id="logout-btn" class="btn btn--outline" style="padding: var(--space-1) var(--space-3); font-size: var(--text-xs);">Logout</button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container" style="max-width: 56rem; padding-block: var(--space-8);">
    <h1 style="font-size: var(--text-3xl); font-weight: 800; margin-bottom: var(--space-6);">Mentorship Workspace</h1>

    <!-- Tabs for Incoming / Outgoing -->
    <div style="display: flex; gap: var(--space-2); border-bottom: 2px solid var(--color-border); margin-bottom: var(--space-6);">
      <button id="tab-incoming" class="btn btn--ghost" style="font-weight: 700; border-bottom: 2px solid var(--color-brand-secondary); border-radius: 0; padding-bottom: var(--space-2);">
        Incoming Requests
      </button>
      <button id="tab-outgoing" class="btn btn--ghost" style="color: var(--color-text-muted); border-radius: 0; padding-bottom: var(--space-2);">
        Outgoing Requests
      </button>
    </div>

    <div id="incoming-section">
      <div id="incoming-list" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <p style="color: var(--color-text-muted);">Loading incoming requests...</p>
      </div>
    </div>

    <div id="outgoing-section" style="display: none;">
      <div id="outgoing-list" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <p style="color: var(--color-text-muted);">Loading outgoing requests...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>ALMATRACE — Department of MCA, PSG College of Technology.</p>
    </div>
  </footer>

  <script type="module">
    import { ApiClient } from '/js/services/api.js';

    const api = new ApiClient('/api/v1');
    const tabIncoming = document.getElementById('tab-incoming');
    const tabOutgoing = document.getElementById('tab-outgoing');
    const incomingSection = document.getElementById('incoming-section');
    const outgoingSection = document.getElementById('outgoing-section');
    const incomingList = document.getElementById('incoming-list');
    const outgoingList = document.getElementById('outgoing-list');

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await api.post('/auth/logout', {}); } catch {}
      window.location.href = '/login.html';
    });

    tabIncoming.addEventListener('click', () => {
      tabIncoming.style.borderBottom = '2px solid var(--color-brand-secondary)';
      tabIncoming.style.color = 'var(--color-brand-secondary)';
      tabOutgoing.style.borderBottom = 'none';
      tabOutgoing.style.color = 'var(--color-text-muted)';
      incomingSection.style.display = 'block';
      outgoingSection.style.display = 'none';
    });

    tabOutgoing.addEventListener('click', () => {
      tabOutgoing.style.borderBottom = '2px solid var(--color-brand-secondary)';
      tabOutgoing.style.color = 'var(--color-brand-secondary)';
      tabIncoming.style.borderBottom = 'none';
      tabIncoming.style.color = 'var(--color-text-muted)';
      incomingSection.style.display = 'none';
      outgoingSection.style.display = 'block';
    });

    async function loadRequests() {
      try {
        const data = await api.get('/mentorship/requests');
        renderIncoming(data.incoming || []);
        renderOutgoing(data.outgoing || []);
      } catch (err) {
        incomingList.innerHTML = `<p style="color: var(--color-error);">Failed to load requests.</p>`;
      }
    }

    function renderIncoming(requests) {
      if (requests.length === 0) {
        incomingList.innerHTML = `<p style="color: var(--color-text-muted); padding: var(--space-6); text-align: center; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);">No incoming mentorship requests.</p>`;
        return;
      }

      incomingList.innerHTML = '';
      for (const req of requests) {
        const card = document.createElement('article');
        card.className = 'feature-card';
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-2);">
            <div>
              <h2 style="font-size: var(--text-base); font-weight: 700;">From: ${req.mentee_name}</h2>
              <span style="font-size: var(--text-xs); color: var(--color-text-muted);">Received: ${new Date(req.created_at).toLocaleDateString()}</span>
            </div>
            <span style="font-size: var(--text-xs); font-weight: 700; padding: 2px 8px; border-radius: 9999px; background: ${req.status === 'accepted' ? '#dcfce7' : req.status === 'sent' ? '#fef3c7' : 'var(--color-surface-raised)'}; color: ${req.status === 'accepted' ? '#15803d' : req.status === 'sent' ? '#b45309' : 'var(--color-text-muted)'};">
              ${req.status.toUpperCase()}
            </span>
          </div>

          <div style="margin-bottom: var(--space-3); font-size: var(--text-sm);">
            <strong>Purpose:</strong> ${req.purpose}
          </div>
          ${req.message ? `<div style="font-size: var(--text-xs); color: var(--color-text-muted); background: var(--color-surface-raised); padding: var(--space-2); border-radius: var(--radius); margin-bottom: var(--space-3);">${req.message}</div>` : ''}

          ${req.status === 'sent' ? `
            <div style="display: flex; gap: var(--space-2); justify-content: flex-end;">
              <button class="btn btn--ghost decline-btn" data-id="${req.id}" style="font-size: var(--text-xs); color: var(--color-error);">Decline</button>
              <button class="btn btn--primary accept-btn" data-id="${req.id}" style="font-size: var(--text-xs);">Accept Request</button>
            </div>
          ` : ''}
        `;

        incomingList.appendChild(card);
      }

      document.querySelectorAll('.accept-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await api.patch(`/mentorship/requests/${btn.dataset.id}`, { action: 'accept' });
            alert('Mentorship accepted! You can now arrange meetings.');
            loadRequests();
          } catch (err) {
            alert(err.message || 'Failed to accept request.');
            btn.disabled = false;
          }
        });
      });

      document.querySelectorAll('.decline-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Are you sure you want to decline this request?')) return;
          btn.disabled = true;
          try {
            await api.patch(`/mentorship/requests/${btn.dataset.id}`, { action: 'decline' });
            loadRequests();
          } catch (err) {
            alert(err.message || 'Failed to decline request.');
            btn.disabled = false;
          }
        });
      });
    }

    function renderOutgoing(requests) {
      if (requests.length === 0) {
        outgoingList.innerHTML = `<p style="color: var(--color-text-muted); padding: var(--space-6); text-align: center; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);">No outgoing mentorship requests sent.</p>`;
        return;
      }

      outgoingList.innerHTML = '';
      for (const req of requests) {
        const card = document.createElement('article');
        card.className = 'feature-card';
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-2);">
            <div>
              <h2 style="font-size: var(--text-base); font-weight: 700;">To: ${req.mentor_name}</h2>
              <span style="font-size: var(--text-xs); color: var(--color-text-muted);">Sent: ${new Date(req.created_at).toLocaleDateString()}</span>
            </div>
            <span style="font-size: var(--text-xs); font-weight: 700; padding: 2px 8px; border-radius: 9999px; background: ${req.status === 'accepted' ? '#dcfce7' : req.status === 'sent' ? '#fef3c7' : 'var(--color-surface-raised)'}; color: ${req.status === 'accepted' ? '#15803d' : req.status === 'sent' ? '#b45309' : 'var(--color-text-muted)'};">
              ${req.status.toUpperCase()}
            </span>
          </div>

          <div style="margin-bottom: var(--space-3); font-size: var(--text-sm);">
            <strong>Purpose:</strong> ${req.purpose}
          </div>

          ${req.status === 'sent' ? `
            <div style="display: flex; justify-content: flex-end;">
              <button class="btn btn--ghost withdraw-btn" data-id="${req.id}" style="font-size: var(--text-xs); color: var(--color-error);">Withdraw Request</button>
            </div>
          ` : ''}
        `;

        outgoingList.appendChild(card);
      }

      document.querySelectorAll('.withdraw-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Withdraw this request?')) return;
          try {
            await api.patch(`/mentorship/requests/${btn.dataset.id}`, { action: 'withdraw' });
            loadRequests();
          } catch (err) {
            alert(err.message || 'Failed to withdraw.');
          }
        });
      });
    }

    loadRequests();
  </script>
</body>
</html>
